<!-- ============================================================
     Dr. Ahmad Al-Wahidi — Portrait card
     Paste this whole block into an Elementor "HTML" widget.

     WHY THE CAPTION WAS INVISIBLE
     `display` was the one property the old CSS never set. Themes
     commonly ship `figcaption { display: none }`, and with nothing
     to oppose it that rule won outright — every other property was
     guarded with !important, so the bug looked like a z-index or
     positioning problem when it was neither.

     Fixed by stating display/visibility/opacity explicitly and
     scoping every selector to the wrapper, so these rules outrank
     even a bare `figcaption { ... !important }` from the theme.
     ============================================================ -->

<style>
  /* Parent Elementor column must not clip the card. */
  .elementor-element-9a1f76a { overflow: visible !important; }

  .custom-doctor-image-wrap {
    /* Same family as the hero: brand hue 196.3deg at accessible steps. */
    --dr-brand: #2E9CC5;
    --dr-deep: #19556B;
    --dr-ink: #103846;
    --dr-radius: 8px;
    --dr-font: Figtree, "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    position: relative !important;
    display: block !important;
    width: min(100%, 420px) !important;
    margin: 0 auto !important;
    overflow: hidden !important;
    isolation: isolate !important;
    border: 1px solid rgb(255 255 255 / 0.88) !important;
    border-radius: var(--dr-radius) !important;
    background: #EAF2F9 !important;
    box-shadow:
      0 1.5rem 3.5rem rgb(16 56 70 / 0.16),
      0 0.375rem 1.125rem rgb(16 56 70 / 0.08) !important;
  }

  .custom-doctor-image-wrap *,
  .custom-doctor-image-wrap *::before,
  .custom-doctor-image-wrap *::after {
    box-sizing: border-box !important;
  }

  /* Inner hairline. Kept below the caption. */
  .custom-doctor-image-wrap::after {
    content: "" !important;
    position: absolute !important;
    inset: 0 !important;
    z-index: 2 !important;
    border-radius: inherit !important;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.42) !important;
    pointer-events: none !important;
  }

  /* z-index pinned to 0 so a theme cannot lift the photo over the caption. */
  .custom-doctor-image-wrap .custom-doctor-image {
    position: relative !important;
    z-index: 0 !important;
    display: block !important;
    width: 100% !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    visibility: visible !important;
    opacity: 1 !important;
    max-width: 100% !important;
  }

  /* THE FIX — `display` and the visibility trio are stated here, and the
     selector is scoped so it outranks `figcaption { ... !important }`. */
  .custom-doctor-image-wrap .custom-doctor-image-caption {
    position: absolute !important;
    z-index: 3 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;
    top: auto !important;
    display: block !important;
    visibility: visible !important;
    width: auto !important;
    max-width: none !important;
    height: auto !important;
    max-height: none !important;
    margin: 0 !important;
    padding: clamp(3.5rem, 12vw, 4.875rem) clamp(1.1rem, 4vw, 1.625rem) clamp(1.1rem, 3.5vw, 1.5rem) !important;
    border: 0 !important;
    color: #FFFFFF !important;
    background: linear-gradient(
      to top,
      rgb(16 56 70 / 0.97) 0%,
      rgb(16 56 70 / 0.82) 46%,
      rgb(16 56 70 / 0) 100%
    ) !important;
    opacity: 1 !important;
    clip: auto !important;
    clip-path: none !important;
    transform: none !important;
    font-family: var(--dr-font) !important;
    text-align: left !important;
    direction: ltr !important;
  }

  /* Brand tick rule — ties the card to the hero's eyebrow. */
  .custom-doctor-image-wrap .custom-doctor-image-caption::before {
    content: "" !important;
    display: block !important;
    width: 2.25rem !important;
    height: 7px !important;
    margin-bottom: 0.85rem !important;
    background-image: repeating-linear-gradient(
      90deg,
      var(--dr-brand) 0 1px,
      transparent 1px 5px
    ) !important;
    opacity: 0.9 !important;
  }

  .custom-doctor-image-wrap .custom-doctor-image-caption__name {
    display: block !important;
    visibility: visible !important;
    margin: 0 0 0.375rem !important;
    color: #FFFFFF !important;
    font-family: var(--dr-font) !important;
    font-size: clamp(1.25rem, 2.2vw, 1.5rem) !important;
    font-weight: 700 !important;
    line-height: 1.15 !important;
    letter-spacing: -0.025em !important;
    opacity: 1 !important;
  }

  .custom-doctor-image-wrap .custom-doctor-image-caption__title {
    display: block !important;
    visibility: visible !important;
    max-width: 22rem !important;
    margin: 0 !important;
    color: rgb(255 255 255 / 0.92) !important;
    font-family: var(--dr-font) !important;
    font-size: clamp(0.75rem, 1.4vw, 0.875rem) !important;
    font-weight: 500 !important;
    line-height: 1.55 !important;
    opacity: 1 !important;
  }

  @media (max-width: 47.9375rem) {
    .custom-doctor-image-wrap {
      width: min(100%, 320px) !important;
      margin: 1.5rem auto 0 !important;
      z-index: 1 !important;
    }
  }

  /* If the viewer asks for less transparency, drop the gradient for a
     solid bar — the text stays readable and the photo stays uncropped. */
  @media (prefers-reduced-transparency: reduce) {
    .custom-doctor-image-wrap .custom-doctor-image-caption {
      background: var(--dr-ink) !important;
    }
  }
</style>

<figure class="custom-doctor-image-wrap" dir="ltr">
  <img
    class="custom-doctor-image"
    src="https://elwahidiclinic.com/wp-content/uploads/2026/08/dr.-ahmed-elwahidi-03.jpg.jpeg"
    alt="Dr. Ahmad Al-Wahidi"
    width="683"
    height="1024"
    loading="eager"
    fetchpriority="high"
    decoding="async"
  >

  <figcaption class="custom-doctor-image-caption">
    <strong class="custom-doctor-image-caption__name">Dr. Ahmad Al-Wahidi</strong>
    <span class="custom-doctor-image-caption__title">
      German Board-Certified Surgeon in General and Gastrointestinal Surgery
    </span>
  </figcaption>
</figure>
